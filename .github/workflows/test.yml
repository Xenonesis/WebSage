name: WebSage CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Syntax check all extension scripts
      run: |
        node --check background.js
        node --check content.js
        node --check popup.js
        node --check nlp.js
        node --check nlp.test.js
        node --check scripts/generate-icons.js
        node --check scripts/validate-manifest.js
        node --check scripts/scan-secrets.js

    - name: NLP unit tests
      run: node --test nlp.test.js

    - name: Validate manifest and bundled files
      run: node scripts/validate-manifest.js

    - name: Secret / inline-handler scan
      run: node scripts/scan-secrets.js

    - name: Validate documentation files exist
      run: |
        for f in README.md SECURITY.md CHANGELOG.md; do
          if [ ! -s "$f" ]; then
            echo "Missing or empty $f"
            exit 1
          fi
        done
        echo "Documentation files present"
